<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Simulador de Presidente do Brasil — campanha, Congresso, STF, economia e diplomacia.">
  <title>{% block titulo %}Simulador Presidencial · Brasil{% endblock %}</title>
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='img/logo.jpg') }}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sim_tema') || 'auto';
        var d = t === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : t === 'dark';
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
        if (localStorage.getItem('sim_anim') === '0') document.documentElement.classList.add('sem-animacao');
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/componentes.css') }}">
  {% block estilos %}{% endblock %}
</head>
<body {% block body_attrs %}{% endblock %}>
  {% block corpo %}{% endblock %}
  <div id="toasts" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/core.js') }}"></script>
  <script src="{{ url_for('static', filename='js/avatar.js') }}"></script>
  <script src="{{ url_for('static', filename='js/mapa.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
