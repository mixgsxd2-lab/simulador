{% extends "base.html" %}
{% block titulo %}Partida {{ codigo }} · Simulador Presidencial{% endblock %}
{% block estilos %}<link rel="stylesheet" href="{{ url_for('static', filename='css/jogo.css') }}">{% endblock %}
{% block body_attrs %}data-codigo="{{ codigo }}"{% endblock %}
{% block corpo %}
<div id="jogo"><div class="veu"><div class="coluna" style="align-items:center"><span class="spinner"></span><span class="suave">Carregando o Planalto…</span></div></div></div>
<div id="modal-raiz"></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/views.js') }}"></script>
<script src="{{ url_for('static', filename='js/game.js') }}"></script>
<script src="{{ url_for('static', filename='js/tutorial.js') }}"></script>
{% endblock %}
